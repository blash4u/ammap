<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>안면도 스마트 구역카드</title>

  <!-- 카카오 공식 가이드 규격: autoload=false 필수 적용 -->
  <script type="text/javascript" src="//dapi.kakao.com/v2/maps/sdk.js?appkey=e41e9b55de02ad81ebeb00e3721d52e2&libraries=services&autoload=false"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: "Malgun Gothic", -apple-system, sans-serif; }
    body { display: flex; flex-direction: column; height: 100vh; background-color: #f1f5f9; }

    .header { background-color: #1e293b; padding: 12px 10px; }
    .header-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
    .title { color: #38bdf8; font-size: 15px; font-weight: bold; }
    .btn-gps { background: #0284c7; color: #fff; border: none; padding: 4px 8px; border-radius: 12px; font-size: 11px; font-weight: bold; cursor: pointer; }

    .dropdown-group { display: flex; gap: 5px; width: 100%; }
    .select-btn { height: 38px; padding: 4px; border-radius: 5px; font-size: 12px; font-weight: bold; border: 1px solid #475569; outline: none; }
    #selTown { flex: 2.5; background: #334155; color: white; }
    #selVillage { flex: 2.5; background: #334155; color: white; }
    #selZone { flex: 5; background: #0ea5e9; color: white; border: none; }

    /* 지도 컨테이너 */
    #map-wrapper { position: relative; width: 100%; height: 42vh; background-color: #cbd5e1; }
    #map { width: 100%; height: 100%; }
    #map-status { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: flex; flex-direction: column; justify-content: center; align-items: center; background: #e2e8f0; color: #475569; font-size: 13px; font-weight: bold; z-index: 10; padding: 15px; text-align: center; line-height: 1.5; }

    .info-bar { background-color: #ffffff; padding: 8px 12px; font-weight: bold; font-size: 13px; color: #0f172a; border-bottom: 1px solid #cbd5e1; display: flex; justify-content: space-between; align-items: center; }
    .prog-text { font-size: 12px; color: #10b981; font-weight: 800; }

    .list-area { flex: 1; overflow-y: auto; padding: 8px; background-color: #f8fafc; }
    .house-card { background: white; border: 1px solid #cbd5e1; border-radius: 8px; padding: 10px; margin-bottom: 6px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 1px 2px rgba(0,0,0,0.05); }
    .house-card.completed { background: #d1fae5; border-color: #10b981; }
    .house-card.completed .address-text { text-decoration: line-through; color: #065f46; }
    
    .address-text { font-size: 13px; font-weight: bold; color: #1e293b; }
    .btn-wrap { display: flex; gap: 5px; align-items: center; }
    .btn-navi { background: #fde047; color: #854d0e; text-decoration: none; padding: 5px 8px; border-radius: 4px; font-size: 11px; font-weight: bold; }
    .btn-check { background: #64748b; color: white; border: none; padding: 5px 10px; border-radius: 4px; font-size: 11px; font-weight: bold; cursor: pointer; }
    .btn-check.completed { background: #10b981; }
  </style>
</head>
<body>

  <div class="header">
    <div class="header-top">
      <div class="title">안면도 스마트 구역카드</div>
      <button class="btn-gps" onclick="locateUser()">내 위치 📍</button>
    </div>
    <div class="dropdown-group">
      <select id="selTown" class="select-btn" onchange="onTownChange()">
        <option value="안면읍" selected>안면읍</option>
        <option value="고남면">고남면</option>
        <option value="남면">남면</option>
      </select>
      <select id="selVillage" class="select-btn" onchange="onVillageChange()"></select>
      <select id="selZone" class="select-btn" onchange="onZoneChange()"></select>
    </div>
  </div>

  <div id="map-wrapper">
    <div id="map"></div>
    <div id="map-status">카카오 지도 모듈 초기화 중...</div>
  </div>

  <div class="info-bar">
    <span id="zoneTitle">구역 로딩중...</span>
    <span class="prog-text" id="progRatio">0 / 0 (0%)</span>
  </div>

  <div class="list-area" id="listArea"></div>

  <script>
    const VILLAGE_MAP = {
      "안면읍": ["승언리", "창기리", "중장리", "정당리", "신야리", "황도리"],
      "고남면": ["고남리", "장곡리", "누동리"],
      "남면": ["신온리", "달산리", "몽산리", "신장리", "진산리", "양잠리", "원청리", "당암리"]
    };

    const SEUNGEON_ZONES = {
      "승언-01": { title: "승언-01 (구억말/광지길)", addrs: ["충청남도 태안군 안면읍 광지길 16", "충청남도 태안군 안면읍 광지길 47", "충청남도 태안군 안면읍 광지길 71", "충청남도 태안군 안면읍 구억말길 11", "충청남도 태안군 안면읍 구억말길 16", "충청남도 태안군 안면읍 구억말길 35", "충청남도 태안군 안면읍 구억말길 18-5", "충청남도 태안군 안면읍 구억말길 18-45"] },
      "승언-02": { title: "승언-02 (그네들길 입구)", addrs: ["충청남도 태안군 안면읍 그네들길 1", "충청남도 태안군 안면읍 그네들길 7", "충청남도 태안군 안면읍 그네들길 15", "충청남도 태안군 안면읍 그네들길 27", "충청남도 태안군 안면읍 그네들길 37", "충청남도 태안군 안면읍 그네들길 43", "충청남도 태안군 안면읍 그네들길 55"] },
      "승언-03": { title: "승언-03 (그물목길 일대)", addrs: ["충청남도 태안군 안면읍 그물목길 4", "충청남도 태안군 안면읍 그물목길 24", "충청남도 태안군 안면읍 그물목길 93", "충청남도 태안군 안면읍 그물목길 124", "충청남도 태안군 안면읍 그물목길 157", "충청남도 태안군 안면읍 그물목길 187"] },
      "승언-04": { title: "승언-04 (꽃지1길 북단)", addrs: ["충청남도 태안군 안면읍 꽃지1길 20", "충청남도 태안군 안면읍 꽃지1길 42", "충청남도 태안군 안면읍 꽃지1길 88", "충청남도 태안군 안면읍 꽃지1길 108-2", "충청남도 태안군 안면읍 꽃지1길 151", "충청남도 태안군 안면읍 꽃지1길 213"] },
      "승언-05": { title: "승언-05 (꽃지해안로 일대)", addrs: ["충청남도 태안군 안면읍 꽃지해안로 102", "충청남도 태안군 안면읍 꽃지해안로 134", "충청남도 태안군 안면읍 꽃지해안로 276", "충청남도 태안군 안면읍 꽃지해안로 400", "충청남도 태안군 안면읍 꽃지해안로 433", "충청남도 태안군 안면읍 꽃지해안로 491"] },
      "승언-06": { title: "승언-06 (장터로 터미널)", addrs: ["충청남도 태안군 안면읍 장터로 10", "충청남도 태안군 안면읍 장터로 19", "충청남도 태안군 안면읍 장터로 35", "충청남도 태안군 안면읍 장터로 65", "충청남도 태안군 안면읍 장터로 85", "충청남도 태안군 안면읍 장터로 115"] },
      "승언-07": { title: "승언-07 (방포로 중심)", addrs: ["충청남도 태안군 안면읍 방포로 1", "충청남도 태안군 안면읍 방포로 12", "충청남도 태안군 안면읍 방포로 28", "충청남도 태안군 안면읍 방포로 46", "충청남도 태안군 안면읍 방포로 88", "충청남도 태안군 안면읍 방포로 118"] },
      "승언-08": { title: "승언-08 (안면대로 입구)", addrs: ["충청남도 태안군 안면읍 안면대로 2639-7", "충청남도 태안군 안면읍 안면대로 2652", "충청남도 태안군 안면읍 안면대로 2672", "충청남도 태안군 안면읍 안면대로 2691", "충청남도 태안군 안면읍 안면대로 2763-2", "충청남도 태안군 안면읍 안면대로 2792"] }
    };
    for(let i = 9; i <= 35; i++) {
      const zid = `승언-${i < 10 ? '0'+i : i}`;
      SEUNGEON_ZONES[zid] = {
        title: `${zid} (안면읍 외곽 ${i}구역)`,
        addrs: [`충청남도 태안군 안면읍 방포1길 ${i*2}`, `충청남도 태안군 안면읍 송림길 ${i*3}`, `충청남도 태안군 안면읍 밧개길 ${10+i*2}`]
      };
    }

    let map = null, geocoder = null, userMarker = null;
    let markers = [];
    let curTown = "안면읍", curVillage = "승언리", curZoneKey = "승언-01";
    let doneMap = JSON.parse(localStorage.getItem('volunteer_done_v7') || '{}');

    // 초기 드롭다운 설정
    updateVillageDropdown();
    updateZoneDropdown();
    renderCurrentList();

    // 화면 준비 완료 시 카카오맵 정식 로드
    window.onload = function() {
      if (typeof kakao === 'undefined') {
        document.getElementById('map-status').innerHTML = 
          "<span style='color:#ef4444; font-size:14px;'>[카카오 지도 모듈 차단됨]</span><br><br>" +
          "카카오 디벨로퍼스 왼쪽 메뉴의<br><b>[제품 설정] > [카카오맵]</b>에 들어가서<br>" +
          "<b style='color:#dc2626;'>상태: 활성화(ON)</b>를 켜주세요!";
        return;
      }

      // autoload=false 규격 로딩
      kakao.maps.load(function() {
        try {
          const container = document.getElementById('map');
          const options = { center: new kakao.maps.LatLng(36.5268, 126.3533), level: 5 };
          map = new kakao.maps.Map(container, options);
          geocoder = new kakao.maps.services.Geocoder();

          document.getElementById('map-status').style.display = 'none';
          drawPinsForCurrentZone();
        } catch (err) {
          document.getElementById('map-status').innerHTML = 
            "<span style='color:#ef4444;'>지도 생성 오류: " + err.message + "</span>";
        }
      });
    };

    function onTownChange() {
      curTown = document.getElementById('selTown').value;
      updateVillageDropdown();
      onVillageChange();
    }

    function updateVillageDropdown() {
      const vSelect = document.getElementById('selVillage');
      vSelect.innerHTML = '';
      (VILLAGE_MAP[curTown] || []).forEach(v => {
        const opt = document.createElement('option');
        opt.value = v;
        opt.innerText = v;
        vSelect.appendChild(opt);
      });
      curVillage = (VILLAGE_MAP[curTown] || [])[0] || '';
    }

    function onVillageChange() {
      curVillage = document.getElementById('selVillage').value;
      updateZoneDropdown();
      onZoneChange();
    }

    function updateZoneDropdown() {
      const zSelect = document.getElementById('selZone');
      zSelect.innerHTML = '';

      if (curTown === '안면읍' && curVillage === '승언리') {
        Object.keys(SEUNGEON_ZONES).forEach(k => {
          const opt = document.createElement('option');
          opt.value = k;
          opt.innerText = SEUNGEON_ZONES[k].title;
          zSelect.appendChild(opt);
        });
        curZoneKey = "승언-01";
      } else {
        const opt = document.createElement('option');
        opt.value = "";
        opt.innerText = "데이터 준비중";
        zSelect.appendChild(opt);
        curZoneKey = "";
      }
    }

    function onZoneChange() {
      curZoneKey = document.getElementById('selZone').value;
      renderCurrentList();
      if (map && geocoder) {
        drawPinsForCurrentZone();
      }
    }

    function renderCurrentList() {
      const zone = SEUNGEON_ZONES[curZoneKey];
      const listEl = document.getElementById('listArea');
      listEl.innerHTML = '';

      if (!zone) {
        document.getElementById('zoneTitle').innerText = `${curVillage} (준비 중)`;
        document.getElementById('progRatio').innerText = '0 / 0 (0%)';
        return;
      }

      document.getElementById('zoneTitle').innerText = zone.title;
      let doneCnt = 0;

      zone.addrs.forEach((addr, idx) => {
        const isDone = !!doneMap[addr];
        if (isDone) doneCnt++;

        const card = document.createElement('div');
        card.className = 'house-card' + (isDone ? ' completed' : '');
        card.innerHTML = `
          <div class="address-text">#${idx + 1}. ${addr.replace('충청남도 태안군 안면읍 ', '')}</div>
          <div class="btn-wrap">
            <a class="btn-navi" href="https://map.kakao.com/link/search/${encodeURIComponent(addr)}" target="_blank">길안내</a>
            <button class="btn-check ${isDone ? 'completed' : ''}" onclick="toggleDone('${addr}')">
              ${isDone ? '완료' : '미방문'}
            </button>
          </div>
        `;
        listEl.appendChild(card);
      });

      const pct = zone.addrs.length > 0 ? Math.round((doneCnt / zone.addrs.length) * 100) : 0;
      document.getElementById('progRatio').innerText = `${doneCnt} / ${zone.addrs.length} (${pct}%)`;
    }

    function drawPinsForCurrentZone() {
      markers.forEach(m => m.setMap(null));
      markers = [];

      const zone = SEUNGEON_ZONES[curZoneKey];
      if (!zone || !geocoder) return;

      const bounds = new kakao.maps.LatLngBounds();
      let count = 0;

      zone.addrs.forEach(addr => {
        geocoder.addressSearch(addr, function(result, status) {
          if (status === kakao.maps.services.Status.OK) {
            const pos = new kakao.maps.LatLng(result[0].y, result[0].x);
            const isDone = !!doneMap[addr];

            const imgUrl = isDone
              ? 'https://t1.daumcdn.net/localimg/localimages/07/mapapidoc/marker_green.png'
              : 'https://t1.daumcdn.net/localimg/localimages/07/mapapidoc/marker_red.png';

            const marker = new kakao.maps.Marker({
              map: map,
              position: pos,
              image: new kakao.maps.MarkerImage(imgUrl, new kakao.maps.Size(24, 35))
            });

            kakao.maps.event.addListener(marker, 'click', function() {
              toggleDone(addr);
            });

            markers.push(marker);
            bounds.extend(pos);
            count++;

            if (count > 0) {
              map.setBounds(bounds);
            }
          }
        });
      });
    }

    function toggleDone(addr) {
      doneMap[addr] = !doneMap[addr];
      localStorage.setItem('volunteer_done_v7', JSON.stringify(doneMap));
      renderCurrentList();
      if (map && geocoder) {
        drawPinsForCurrentZone();
      }
    }

    function locateUser() {
      if (!navigator.geolocation || !map) {
        alert("GPS 위치 서비스를 사용할 수 없습니다.");
        return;
      }
      navigator.geolocation.getCurrentPosition(pos => {
        const latLng = new kakao.maps.LatLng(pos.coords.latitude, pos.coords.longitude);
        if (userMarker) userMarker.setMap(null);
        userMarker = new kakao.maps.Marker({ map: map, position: latLng });
        map.setCenter(latLng);
        map.setLevel(3);
      });
    }
  </script>
</body>
</html>
